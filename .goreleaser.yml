version: 2

project_name: maxminddb-mcp

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - &build
    id: maxminddb-mcp
    binary: maxminddb-mcp
    main: ./cmd/maxminddb-mcp/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath
    hooks:
      post:
        - 'node scripts/package-extension.mjs "{{ .Path }}" "{{ .Version }}" "{{ .Os }}" "{{ .Arch }}" dist'
  - <<: *build
    id: darwin
    goos: [darwin]
    goarch: [amd64, arm64]
    ignore: []

archives:
  - id: default
    ids: [maxminddb-mcp]
    formats:
      - tar.gz
      - zip
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
  - id: darwin
    ids: [darwin]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: darwin-zip
    ids: [darwin]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256
  extra_files:
    - glob: dist/*.mcpb
    - glob: dist/*_claude-plugin.zip
    - glob: dist/*_openai-plugin.zip
    - glob: dist/*.maxminddb-mcp-gemini.zip

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Performance improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: Others
      order: 999

dockers_v2:
  - &container
    id: multiarch
    ids: [maxminddb-mcp]
    images: [ghcr.io/oschwald/maxminddb-mcp]
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    flags: ["--pull=true"]
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/oschwald/maxminddb-mcp
      io.modelcontextprotocol.server.name: io.github.oschwald/maxminddb

  - <<: *container
    id: amd64
    platforms: [linux/amd64]
    tags:
      - "{{ .Version }}-amd64"
      - "{{ if not .IsSnapshot }}latest-amd64{{ end }}"

  - <<: *container
    id: arm64
    platforms: [linux/arm64]
    tags:
      - "{{ .Version }}-arm64"
      - "{{ if not .IsSnapshot }}latest-arm64{{ end }}"

nfpms:
  - id: packages
    package_name: maxminddb-mcp
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    vendor: MaxMindDB MCP Server
    homepage: https://github.com/oschwald/maxminddb-mcp
    maintainer: Greg Oschwald <oschwald@maxmind.com>
    description: A powerful Model Context Protocol (MCP) server for MaxMindDB databases
    license: ISC
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/maxminddb-mcp/LICENSE
      - src: README.md
        dst: /usr/share/doc/maxminddb-mcp/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/maxminddb-mcp/CHANGELOG.md

homebrew_casks:
  - name: maxminddb-mcp
    ids: [darwin]
    repository:
      owner: oschwald
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}auto{{ else }}true{{ end }}'
    homepage: https://github.com/oschwald/maxminddb-mcp
    description: Query MaxMind databases through MCP
    binaries: [maxminddb-mcp]

release:
  github:
    owner: oschwald
    name: maxminddb-mcp
  draft: false
  prerelease: auto
  mode: replace
  extra_files:
    - glob: dist/*.mcpb
    - glob: dist/*_claude-plugin.zip
    - glob: dist/*_openai-plugin.zip
    - glob: dist/*.maxminddb-mcp-gemini.zip
  header: |
    ## MaxMindDB MCP Server {{ .Version }}
    
    This release includes binaries for multiple platforms and architectures.
    
    ### Container Images
    
    ```bash
    # Pull the latest image
    docker pull ghcr.io/oschwald/maxminddb-mcp:{{ .Version }}
    
    # Set database_dir = "/data" in the config and make it readable by UID 1001.
    docker run --rm -i \
      -v "$HOME/.config/maxminddb-mcp/config.toml:/config/config.toml:ro" \
      -v maxminddb-data:/data \
      ghcr.io/oschwald/maxminddb-mcp:{{ .Version }}
    ```
    
  footer: |
    ### Installation

    **Claude Desktop:** Download `maxminddb.mcpb`.
    It includes all supported platforms. Smaller platform-specific MCPBs are also available.
    Open Settings > Extensions > Advanced settings > Install Extension and select the file.
    Enter your MaxMind account settings, or turn off downloads and choose a folder of MMDB files.
    No terminal, Go installation, or config file is required.

    **Claude plugin:** Download `maxminddb-claude-plugin.zip` for the universal
    bundle and setup and IP investigation skills. Follow the
    [Claude client guide](https://github.com/oschwald/maxminddb-mcp/blob/main/docs/clients.md#claude-code)
    for marketplace installation and settings.

    **Standalone:** Download an archive or Linux package for your platform.
    See the [installation guide](https://github.com/oschwald/maxminddb-mcp#installation)
    for ChatGPT desktop, Codex, Claude Code, and experimental desktop plugins.

    **ChatGPT desktop plugin (experimental):** Download the `_openai-plugin.zip`
    for your OS and architecture. It includes the server and a setup skill.
    Follow the [local plugin guide](https://github.com/oschwald/maxminddb-mcp#chatgpt-desktop-plugin-experimental).
    Existing server configuration is required. This is not a public directory listing.

    **Antigravity CLI:** Install and configure the standalone executable, then run
    `agy plugin install https://github.com/oschwald/maxminddb-mcp`.

    **Gemini CLI (legacy):** Run `gemini extensions install https://github.com/oschwald/maxminddb-mcp`.
    Gemini selects a native extension ZIP and prompts for MaxMind credentials.
    
    **Go Install:**
    ```bash
    go install github.com/oschwald/maxminddb-mcp/cmd/maxminddb-mcp@v{{ .Version }}
    ```
    
    **Docker:**
    ```bash
    docker pull ghcr.io/oschwald/maxminddb-mcp:{{ .Version }}
    ```
    
    **Package Managers:**
    - `.deb`, `.rpm`, and `.apk` packages available in release assets

  name_template: "Release {{.Version}}"
