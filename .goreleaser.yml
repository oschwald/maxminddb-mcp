version: 2

project_name: maxminddb-mcp

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: maxminddb-mcp
    binary: maxminddb-mcp
    main: ./cmd/maxminddb-mcp/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    formats:
      - tar.gz
      - zip
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Performance improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: Others
      order: 999

dockers_v2:
  - &container
    id: multiarch
    ids: [maxminddb-mcp]
    images: [ghcr.io/oschwald/maxminddb-mcp]
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    flags: ["--pull=true"]
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/oschwald/maxminddb-mcp

  - <<: *container
    id: amd64
    platforms: [linux/amd64]
    tags:
      - "{{ .Version }}-amd64"
      - "{{ if not .IsSnapshot }}latest-amd64{{ end }}"

  - <<: *container
    id: arm64
    platforms: [linux/arm64]
    tags:
      - "{{ .Version }}-arm64"
      - "{{ if not .IsSnapshot }}latest-arm64{{ end }}"

nfpms:
  - id: packages
    package_name: maxminddb-mcp
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    vendor: MaxMindDB MCP Server
    homepage: https://github.com/oschwald/maxminddb-mcp
    maintainer: Greg Oschwald <oschwald@maxmind.com>
    description: A powerful Model Context Protocol (MCP) server for MaxMindDB databases
    license: ISC
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/maxminddb-mcp/LICENSE
      - src: README.md
        dst: /usr/share/doc/maxminddb-mcp/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/maxminddb-mcp/CHANGELOG.md

release:
  github:
    owner: oschwald
    name: maxminddb-mcp
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## MaxMindDB MCP Server {{ .Version }}
    
    This release includes binaries for multiple platforms and architectures.
    
    ### Container Images
    
    ```bash
    # Pull the latest image
    docker pull ghcr.io/oschwald/maxminddb-mcp:{{ .Version }}
    
    # Set database_dir = "/data" in the config and make it readable by UID 1001.
    docker run --rm -i \
      -v "$HOME/.config/maxminddb-mcp/config.toml:/config/config.toml:ro" \
      -v maxminddb-data:/data \
      ghcr.io/oschwald/maxminddb-mcp:{{ .Version }}
    ```
    
  footer: |
    ### Installation
    
    **Go Install:**
    ```bash
    go install github.com/oschwald/maxminddb-mcp/cmd/maxminddb-mcp@{{ .Version }}
    ```
    
    **Docker:**
    ```bash
    docker pull ghcr.io/oschwald/maxminddb-mcp:{{ .Version }}
    ```
    
    **Package Managers:**
    - `.deb`, `.rpm`, and `.apk` packages available in release assets

  name_template: "Release {{.Version}}"