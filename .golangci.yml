version: "2"
run:
  go: "1.24"
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nolintlint
    - staticcheck
    - tagliatelle
    - unconvert
    - unused
    - wastedassign
  settings:
    errcheck:
      exclude-functions:
        - (*github.com/oschwald/maxminddb-golang/v2.Reader).Close
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    forbidigo:
      forbid:
        - pattern: Geoip
          msg: you should use `GeoIP`
        - pattern: geoIP
          msg: you should use `geoip`
        - pattern: Maxmind
          msg: you should use `MaxMind`
        - pattern: ^maxMind
          msg: you should use `maxmind`
        - pattern: Minfraud
          msg: you should use `MinFraud`
        - pattern: ^minFraud
          msg: you should use `minfraud`
        - pattern: ^math.Max$
          msg: you should use the max built-in instead.
        - pattern: ^math.Min$
          msg: you should use the min built-in instead.
        - pattern: ^os.IsNotExist
          msg: As per their docs, new code should use errors.Is(err, fs.ErrNotExist).
        - pattern: ^os.IsExist
          msg: As per their docs, new code should use errors.Is(err, fs.ErrExist)
    gosec:
      excludes:
        - G115
        # Potential file inclusion via variable - we only open files asked by
        # the user of the API.
        - G304
    govet:
      disable:
        - shadow
      enable-all: true
    misspell:
      locale: US
      extra-words:
        - typo: marshall
          correction: marshal
        - typo: marshalling
          correction: marshaling
        - typo: marshalls
          correction: marshals
        - typo: unmarshall
          correction: unmarshal
        - typo: unmarshalling
          correction: unmarshaling
        - typo: unmarshalls
          correction: unmarshals
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - lll
        - misspell
      allow-unused: false
    tagliatelle:
      case:
        rules:
          avro: snake
          bson: snake
          env: upperSnake
          envconfig: upperSnake
          json: snake
          mapstructure: snake
          xml: snake
          yaml: snake
  exclusions:
    warn-unused: true
    rules:
      - linters:
          - govet
        path: _test.go
        text: 'fieldalignment:'
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/oschwald/maxminddb-golang)
    gofumpt:
      extra:
        group-params: true
