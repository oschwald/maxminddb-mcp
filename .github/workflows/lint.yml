name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
      
      - name: Install formatter
        run: npm ci

      - name: Check markdown formatting
        run: npm run format:check

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      
      - name: Download Go dependencies
        run: go mod download
      
      - name: Run go vet
        run: go vet ./...
      
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
