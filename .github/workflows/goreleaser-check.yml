name: GoReleaser Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.18.3'
          args: check

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm

      - name: Install packaging tools
        run: npm ci

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build snapshot packages and container images
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.18.3'
          args: release --snapshot --clean
        env:
          HOMEBREW_TAP_TOKEN: ''

      - name: Validate registry metadata
        run: go run github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.1 validate server.json

      - name: Validate Claude plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.302 plugin validate --strict dist/extensions/linux_amd64
