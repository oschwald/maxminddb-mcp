name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run tests
        run: go test -race -cover ./...

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm

      - name: Install packaging tools
        run: npm ci

      - name: Create a test Keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p '' "$RUNNER_TEMP/maxminddb-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/maxminddb-test.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/maxminddb-test.keychain-db"
          security unlock-keychain -p '' "$RUNNER_TEMP/maxminddb-test.keychain-db"

      - name: Test installed extension
        env:
          MAXMINDDB_TEST_CLAUDE_PLUGIN: '1'
        run: npx --yes --package @anthropic-ai/claude-code@2.1.302 -c 'npm run test:extensions'

      - name: Delete the test Keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/maxminddb-test.keychain-db"

      - name: Test fixture generator
        if: runner.os == 'Linux'
        run: go test ./...
        working-directory: testdata

      - name: Check vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      
      - name: Build binary
        run: go build -o bin/maxminddb-mcp ./cmd/maxminddb-mcp
      
      - name: Test binary help
        run: ./bin/maxminddb-mcp --help
