name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm

      - name: Install packaging tools
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run tests
        run: go test -race -cover ./...

      - name: Test installed extension
        run: npm run test:extensions
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.20.3'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/maxminddb-mcp.rb
          if-no-files-found: error
          retention-days: 7

      # GoReleaser leaves the release as a draft. Publish it only after every
      # asset and the final checksums are uploaded.
      - name: Upload universal MCPB and Claude plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node scripts/package-universal-extension.mjs "$version" dist
          gh release upload "$RELEASE_TAG" dist/maxminddb.mcpb dist/maxminddb-claude-plugin.zip dist/claude-marketplace.json dist/checksums.txt --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

  # The cask downloads release assets, so update the tap only once the
  # release is public. Prereleases do not update the tap. This is a separate
  # job so a failed tap update can be rerun without rerunning GoReleaser.
  homebrew:
    name: Update Homebrew cask
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Homebrew cask
        uses: actions/download-artifact@v8.0.0
        with:
          name: homebrew-cask

      - name: Push cask to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            exit 0
          fi
          api_path=repos/oschwald/homebrew-tap/contents/Casks/maxminddb-mcp.rb
          args=(
            --method PUT "$api_path"
            -f message="Brew cask update for maxminddb-mcp version $RELEASE_TAG"
            -f content="$(base64 -w0 maxminddb-mcp.rb)"
          )
          # Only a missing file means a new cask. Report any other error.
          if sha=$(gh api "$api_path" --jq .sha 2>"$RUNNER_TEMP/lookup-error"); then
            args+=(-f sha="$sha")
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/lookup-error"; then
            cat "$RUNNER_TEMP/lookup-error" >&2
            exit 1
          fi
          gh api "${args[@]}" --silent

  registry:
    name: Publish to MCP Registry
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'

      - name: Install registry publisher
        run: go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.1

      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          jq --arg version "$version" '.version = $version | .packages[0].identifier = "ghcr.io/oschwald/maxminddb-mcp:\($version)"' server.json > server-release.json

      - name: Authenticate and publish
        run: |
          publisher login github-oidc
          publisher publish server-release.json
